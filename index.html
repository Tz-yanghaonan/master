<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>记账工具</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      body {
        margin: 0;
        background: #f4f6fb;
        color: #1f2937;
      }

      .container {
        max-width: 860px;
        margin: 0 auto;
        padding: 24px;
      }

      .card {
        background: #ffffff;
        border-radius: 14px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        padding: 20px;
        margin-bottom: 16px;
      }

      h1,
      h2 {
        margin: 0 0 12px;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(3, minmax(120px, 1fr));
        gap: 12px;
      }

      .metric {
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 12px;
      }

      .metric p {
        margin: 0;
      }

      .metric .label {
        color: #6b7280;
        font-size: 13px;
      }

      .metric .value {
        font-size: 20px;
        font-weight: 600;
        margin-top: 6px;
      }

      form {
        display: grid;
        grid-template-columns: repeat(4, minmax(120px, 1fr));
        gap: 12px;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 14px;
      }

      input,
      select,
      button {
        border: 1px solid #d1d5db;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 14px;
      }

      button {
        background: #2563eb;
        color: #ffffff;
        border: none;
        cursor: pointer;
        font-weight: 600;
      }

      button:hover {
        background: #1d4ed8;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        border-bottom: 1px solid #e5e7eb;
        padding: 10px;
        text-align: left;
        font-size: 14px;
      }

      .expense {
        color: #dc2626;
      }

      .income {
        color: #16a34a;
      }

      @media (max-width: 720px) {
        form {
          grid-template-columns: 1fr;
        }

        .summary {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="card">
        <h1>个人记账</h1>
        <p>快速记录日常收入与支出，帮助你掌握资金流向。</p>
      </section>

      <section class="card">
        <h2>收支概览</h2>
        <div class="summary">
          <article class="metric">
            <p class="label">总收入</p>
            <p class="value income">¥ 2,500.00</p>
          </article>
          <article class="metric">
            <p class="label">总支出</p>
            <p class="value expense">¥ 1,220.00</p>
          </article>
          <article class="metric">
            <p class="label">当前结余</p>
            <p class="value">¥ 1,280.00</p>
          </article>
        </div>
      </section>

      <section class="card">
        <h2>新增记录</h2>
        <form>
          <label>
            日期
            <input type="date" name="date" required />
          </label>
          <label>
            类型
            <select name="type">
              <option value="expense">支出</option>
              <option value="income">收入</option>
            </select>
          </label>
          <label>
            分类
            <input type="text" name="category" placeholder="如：餐饮 / 交通" required />
          </label>
          <label>
            金额
            <input type="number" name="amount" min="0" step="0.01" placeholder="0.00" required />
          </label>
          <label style="grid-column: 1 / -1">
            备注
            <input type="text" name="note" placeholder="可选备注" />
          </label>
          <button type="submit">保存记录</button>
        </form>
      </section>

      <section class="card">
        <h2>最近记录</h2>
        <table>
          <thead>
            <tr>
              <th>日期</th>
              <th>类型</th>
              <th>分类</th>
              <th>金额</th>
              <th>备注</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>2026-02-27</td>
              <td class="expense">支出</td>
              <td>餐饮</td>
              <td class="expense">-¥ 68.00</td>
              <td>午餐</td>
            </tr>
            <tr>
              <td>2026-02-26</td>
              <td class="income">收入</td>
              <td>工资</td>
              <td class="income">+¥ 2,500.00</td>
              <td>月度工资</td>
            </tr>
            <tr>
              <td>2026-02-26</td>
              <td class="expense">支出</td>
              <td>交通</td>
              <td class="expense">-¥ 12.00</td>
              <td>地铁</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </body>
</html>
